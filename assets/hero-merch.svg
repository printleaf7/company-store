    <rect x="34" y="66" width="32" height="5" rx="2.5" fill="#FFFFFF" opacity=".7"/>
  </g>
  <!-- cap -->
  <g transform="translate(230 70)">
    <path d="M10 90 Q20 20 110 18 Q200 20 210 90 Z" fill="#F26B3A"/>
    <path d="M0 90 Q105 118 220 90 Q205 104 110 106 Q15 104 0 90 Z" fill="#D85A2C"/>
    <rect x="92" y="34" width="36" height="22" rx="4" fill="#FFFFFF" opacity=".9"/>
    <rect x="100" y="42" width="20" height="6" rx="3" fill="#1B2A4A"/>
  </g>
  <!-- hoodie -->
  <g transform="translate(330 170)">
    <path d="M70 0 H170 Q200 12 210 44 L240 120 L210 134 L196 112 L196 270 H44 L44 112 L30 134 L0 120 L30 44 Q40 12 70 0 Z" fill="#1B2A4A"/>
    <path d="M86 0 Q120 52 154 0 Z" fill="#14213D"/>
    <path d="M96 4 Q120 40 144 4" fill="none" stroke="#2F4470" stroke-width="6"/>
    <path d="M80 190 H160 L168 232 H72 Z" fill="#14213D"/>
    <rect x="98" y="150" width="44" height="18" rx="4" fill="#F26B3A"/>
    <rect x="72" y="106" width="30" height="8" rx="4" fill="#FFFFFF" opacity=".85"/>
    <rect x="62" y="30" width="20" height="2" fill="#2F4470"/>
  </g>
  <!-- tee -->
  <g transform="translate(40 150)">
    <path d="M55 0 H145 Q150 22 175 30 L200 50 L178 95 L156 84 L156 200 H44 L44 84 L22 95 L0 50 L25 30 Q50 22 55 0 Z" fill="#FFFFFF" stroke="#D9D2C7" stroke-width="2"/>
    <path d="M80 0 Q100 24 120 0" fill="none" stroke="#D9D2C7" stroke-width="4"/>
    <rect x="70" y="80" width="60" height="50" rx="4" fill="#2E7D5B"/>
    <rect x="78" y="92" width="44" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="84" y="104" width="32" height="5" rx="2.5" fill="#FFFFFF" opacity=".7"/>
    <rect x="80" y="118" width="40" height="3" rx="1.5" fill="#FFFFFF" opacity=".5"/>
  </g>
  <!-- sticker -->
  <g transform="translate(540 60) rotate(12)">
    <circle r="44" fill="#F26B3A"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF">YOUR</text>
    <text x="0" y="16" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF">LOGO</text>
