<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Flat-lay of branded tees, a hoodie, a cap, a mug and a tote</title>
  <rect width="640" height="520" rx="28" fill="#F1ECE4"/>
  <circle cx="330" cy="260" r="210" fill="#E6DED1"/>
  <!-- tote -->
  <g transform="translate(410 330)">
    <path d="M20 40 Q20 0 60 0 Q100 0 100 40" fill="none" stroke="#C9B99E" stroke-width="10"/>
    <rect x="0" y="36" width="120" height="118" rx="6" fill="#D9C7A8"/>
    <rect x="34" y="78" width="52" height="30" rx="3" fill="#1B2A4A"/>
    <rect x="42" y="86" width="36" height="4" rx="2" fill="#F26B3A"/>
    <rect x="46" y="95" width="28" height="3" rx="1.5" fill="#F7F3EC"/>
  </g>
  <!-- mug -->
  <g transform="translate(90 330)">
    <path d="M92 26 Q126 26 126 60 Q126 94 92 94" fill="none" stroke="#1B2A4A" stroke-width="12"/>
    <rect x="0" y="0" width="100" height="112" rx="10" fill="#FFFFFF"/>
    <rect x="0" y="0" width="100" height="16" rx="8" fill="#1B2A4A"/>
    <rect x="18" y="46" width="64" height="36" rx="4" fill="#F26B3A"/>
